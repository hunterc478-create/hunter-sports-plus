name: Picks peek (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "https://hunterc478-create.github.io/hunter-sports-plus/data/picks.json?x=$RANDOM" -o p.json
          curl -fsS "https://hunterc478-create.github.io/hunter-sports-plus/data/tennis-cands.json?x=$RANDOM" -o t.json
          python3 - <<'PY'
          import json
          d=json.load(open('p.json'))
          print("updatedAt", d.get("updatedAt"))
          for p in d["picks"]:
            if p["sport"]=="Tennis": print(p["start"], p["market"], p["label"], p["odds"], p.get("result","open"), p["matchupId"], p["loggedAt"])
          t=json.load(open('t.json'))
          for c in t["cands"]:
            if c["market"]=="total": print("CAND", c["start"], c["label"], c["home"]["name"], "vs", c["away"]["name"], c["odds"], c["ev"])
          PY
