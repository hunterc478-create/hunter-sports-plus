name: peek
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s "https://hunterc478-create.github.io/hunter-sports-plus/data/picks.json?x=$RANDOM" | jq -r '[.picks[]|select(.sport=="NHL")][0:6][]|"\(.away.name) | \(.away.short) @ \(.home.name) | \(.home.short) :: \(.label)"'
