name: Tennis peek (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, csv, io
          def get(u, raw=False):
            try:
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"sports-plus"}), timeout=60).read()
              return r.decode() if raw else json.loads(r)
            except Exception as e: print("ERR", u[:100], e); return None
          s = get("https://api.elections.kalshi.com/trade-api/v2/series?category=Sports&limit=1000")
          ser = [x["ticker"] for x in (s or {}).get("series", []) if any(k in x.get("ticker","") for k in ("ATP","WTA","CHALL","TENNIS"))]
          print("ALL tennis tickers:", ser)
          for t in ser:
            if not any(k in t for k in ("MATCH","GAME","GTOTAL")): continue
            m = get(f"https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker={t}&status=open&limit=1000")
            ms = (m or {}).get("markets", [])
            print("==", t, "open:", len(ms))
            if ms: print(json.dumps(ms[0])[:1500])
          for u in ["https://raw.githubusercontent.com/JeffSackmann/tennis_atp/master/atp_matches_2026.csv","https://raw.githubusercontent.com/JeffSackmann/tennis_atp/master/atp_matches_qual_chall_2026.csv","https://raw.githubusercontent.com/JeffSackmann/tennis_wta/master/wta_matches_2026.csv","https://raw.githubusercontent.com/JeffSackmann/tennis_wta/master/wta_matches_qual_itf_2026.csv"]:
            t = get(u, raw=True)
            if not t: continue
            rows = list(csv.DictReader(io.StringIO(t)))
            print(u.split('/')[-1], len(rows), "rows; last date", max(r["tourney_date"] for r in rows), "; cols", list(rows[0].keys())[:12])
          PY
